# Task config: colectomy ascertainment (single pass, DIRECT mode).
# Sourced by run_task.sh. Defines: SQL, MODELS, PASSES, preprocess_pass().

SQL=sql/colectomy.sql

# 3-model ensemble (majority-of-3 consensus in aggregate.py).
MODELS=(gemma4-31b gemma4-26b-a4b qwen36-35b-a3b)

# One pass: "name:grammarfile" (grammar relative to ../grammars/).
PASSES=("extract:colectomy.gbnf")

# Build inputs for the 'extract' pass. Ported from
# reproduce_results/colectomy_ascertainment/step2_process_colectomy.py.
preprocess_pass() {
    local pass="$1" outdir="$2" families="$3"
    python3 "$PHENO_DIR/python/make_inputs.py" \
        --sql "$PHENO_DIR/$SQL" \
        --slices "${SLICES:-1}" ${FORCE_INPUTS:+--force} \
        --out "$outdir" \
        --families "$families" \
        --instructions "$PHENO_DIR/prompts/colectomy.txt" \
        --regex '(?i)colectomy|proctectomy|(remov|resect).{0,20}?(colo|rect|cecum|sigmoid)|(colo|rect|cecum|sigmoid).{0,20}?(remov|resect)|hartmann' \
        --lines-before 2 --lines-after 2 \
        --excerpt-limit 20 --n-recent 5 --n-distant 5 --max-excerpts-per-note 15 \
        --question 'Has this patient had all or part of their colon or rectum removed?' \
        --seed 1234
}
