# Model registry for the phenotyping pipeline.
#
# One row per model, pipe-delimited. Leading '#' lines and blank lines are ignored.
# Whitespace around fields is trimmed. Look up a row by its `name` (col 1).
#
# Columns:
#   name       short id used in task configs (config/<task>.conf MODELS=(...))
#   gguf       absolute path to the GGUF on the GPU box   <-- FILL IN real paths
#   family     chat-format family; must exist in make_inputs.py CHAT_FORMATS
#   ctx        context size (--ctx-size)
#   parallel   number of parallel sequences (--parallel)
#   n_predict  generation cap (--n-predict); REQUIRED (>0) so grammar runaways are capped
#              and auto-retried grammar-free instead of crashing the run
#   gpu        GPU placement mode (see below)
#   extra      extra args passed verbatim to llama-data-extraction (optional)
#
# gpu modes:
#   single:N        run on one GPU N              -> -sm none -mg N
#   split           split ONE model across GPUs   -> -sm layer   (for models too big for one GPU)
#   split:row       tensor-parallel by row        -> -sm row
#   split:tensor    tensor split                  -> -sm tensor
#   dual            DATA-PARALLEL: split the inputs in half and run two processes in parallel,
#                   one on GPU 0 (-sm none -mg 0) and one on GPU 1 (-sm none -mg 1); ~2x
#                   throughput for models that fit on a single GPU. aggregate.py merges halves.
#
# NOTE: all inference uses --promptFormat raw; chat wrappers come from make_inputs.py CHAT_FORMATS
#       (verify each family's tokens against the GGUF chat_template before the first real run).
#
# name            | gguf                                              | family | ctx   | parallel | n_predict | gpu   | extra
