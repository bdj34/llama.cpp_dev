# jobs.conf -- one row per JOB, keyed on (task, model, replicate, retry). A queue job
# "<task> <model> <replicate> <retry>" looks up its row here, so everything for that exact job is on
# one line -- and `queue.sh add-all` enqueues every row. Args belong here (not split by task/model)
# because they depend on BOTH: a task's input length against a model's VRAM sets --ctx-size/--parallel,
# and the task's answer length plus the model's thinking mode sets --n-predict. Thinking vs
# non-thinking also use a different grammar/promptFormat -- all per-row, so a variant is just a row.
#
# The replicate is the consensus assignment: give each of a task's models a different replicate
# (model A -> 1, B -> 2, C -> 3) so the three read the complementary input_<r>.txt subsamples.
#
#   task | model | replicate | retry | gguf | prompt_dir | promptFormat | grammar | input_dir | args
#
# task        : task name; also the results subdir and the system-prompt filename.
# model       : model id; also the results subdir (results/<task>/<model>/rep<replicate>).
# replicate   : which inputs_<r>.txt / IDs_<r>.txt this job reads.
# retry       : T or F (part of the KEY). F = normal run. T = a SEPARATE row (same task/model/
#               replicate, retry=T) that reprocesses ONLY the error-only IDs of the F run, with
#               THIS row's settings -- so to re-run failures differently, add a T row with new
#               args/promptFormat/gguf. Both rows write the same outDir; successful IDs are untouched.
#               `run_one.sh <task> <model> <rep>` (3 args) defaults to F; add T as a 4th arg for the T row.
# gguf        : path to the .gguf                                     (-m).
# prompt_dir  : system prompt = system_prompts/<prompt_dir>/<task>.txt   (-sysf).
# promptFormat: --promptFormat value (must be tool-recognized; thinking/non-thinking differ). USUALLY SAME AS PROMPT DIR
# grammar     : grammar filename under grammars/                     (--grammar-file).
# input_dir   : dir with inputs_<r>.txt / IDs_<r>.txt (output of python/preprocessing/extract_<task>.py). 
# args        : inference flags for THIS job (LAST column) -- --ctx-size, --parallel, --n-predict,
#               --batch-size, --n-gpu-layers, --temp (+ thinking --top-k/--top-p), --no-escape,
#              . Do NOT put GPU placement (-sm/-mg) here or --promptFormat (own column):
#               every job runs on ONE card automatically -- the per-card worker's card under the
#               queue, or card 0 for a bare `run_one.sh` launched by hand without --gpu.
#
# --- example: one task's 3-model consensus (each model a different replicate; retry=F) -----------
# ibd | gemma4-nonThinking | 1 | F | /path/gemma.gguf | gemma4-nothink | gemma4_nonThinking | ibd_typeYear.gbnf       | /data/pheno/ibd | --ctx-size 32768 --n-predict 128  --parallel 4 --n-gpu-layers 99 --temp 0 --no-escape
# ibd | gemma4-thinking    | 2 | F | /path/gemma.gguf | gemma4-think   | gemma4_thinking    | ibd_typeYear_think.gbnf | /data/pheno/ibd | --ctx-size 32768 --n-predict 1024 --parallel 4 --n-gpu-layers 99 --temp 0.7 --top-k 64 --no-escape
# ibd | qwen3-thinking     | 3 | F | /path/qwen.gguf  | qwen3-think    | qwen3_thinking     | ibd_typeYear_think.gbnf | /data/pheno/ibd | --ctx-size 32768 --n-predict 1024 --parallel 4 --n-gpu-layers 99 --temp 0.7 --top-k 64
#
# retry example: a SECOND row for job 1 (retry=T) -- reprocess its failures with a bigger n-predict +
# lower temp. Keep the F row above; add this T row, then re-run the queue. (Add T rows AFTER the F run
# has produced errors so there is something to retry.)
# ibd | gemma4-nonThinking | 1 | T | /path/gemma.gguf | gemma4-nothink | gemma4_nonThinking | ibd_typeYear.gbnf | /data/pheno/ibd | --ctx-size 32768 --n-predict 512 --parallel 4 --n-gpu-layers 99 --temp 0.3 --no-escape
# --- END examples ---

